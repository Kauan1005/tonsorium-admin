<!-- Supabase > Authentication > Emails > "Reset password"
     Assunto: Crie uma nova senha -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background-color:#f4f4f2;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Use o botão para escolher uma nova senha.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f2;">
    <tr>
      <td align="center" style="padding:48px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;background-color:#ffffff;border-radius:12px;">
          <tr>
            <td align="center" style="padding:48px 40px 44px;font-family:Arial,Helvetica,sans-serif;">
              <p style="margin:0 0 36px;font-size:13px;font-weight:bold;letter-spacing:6px;color:#0a0a0a;">TONSORIUM</p>
              <h1 style="margin:0 0 12px;font-size:24px;font-weight:bold;line-height:1.3;color:#0a0a0a;">Crie uma nova senha</h1>
              <p style="margin:0 0 32px;font-size:15px;line-height:1.6;color:#6b6b6b;">Toque no botão abaixo para escolher sua nova senha.</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#0a0a0a" style="background-color:#0a0a0a;border-radius:8px;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:16px 40px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:8px;">Criar nova senha</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#9a9a9a;">Não pediu? Sua senha continua a mesma.</p>
      </td>
    </tr>
  </table>
</body>
</html>
